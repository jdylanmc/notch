name: notch-control

on:
  push:
    branches: [pocket]
  pull_request:
    branches: [pocket]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, lint notch-control
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint
      - name: Build helper
        run: bash scripts/notch-control/control.sh build
      - name: Test helper
        run: bash scripts/notch-control/control.sh test
      - name: Lint helper
        run: bash scripts/notch-control/control.sh lint
