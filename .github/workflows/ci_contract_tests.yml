name: CI contract tests

on:
  push:
    branches: [pocket]
  pull_request:
    branches: [pocket]

permissions:
  contents: read

jobs:
  test:
    name: Test product CI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install contract test dependency
        run: npm ci --prefix .github/scripts/ci-contract --ignore-scripts --no-audit --no-fund
      - name: Test workflow contracts
        run: npm test --prefix .github/scripts/ci-contract
      - name: Test PR target policy
        run: node --test .github/scripts/pr-target-policy.test.cjs
      - name: Test local packaging policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_package.py'
      - name: Test local distribution signing policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_distribution.py'
      - name: Test notarization preparation policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_notarize.py'
      - name: Test hosted release boundaries
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_pocket_release.py'
      - name: Test regression probe policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_regression_probe.py'
      - name: Test stable regression runner contracts
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_regression_runner.py'
